[project]
name = "psplink-mcp"
version = "0.1.0"
description = "MCP server that lets Claude drive a PSP through PSPLink's usbhostfs_pc"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pillow>=10",
]

[project.scripts]
psplink-mcp = "psplink_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psplink_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
